<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وضع عدم الاتصال | كوبي كات (Copy Cat)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 1rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .note {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>أنت غير متصل بالإنترنت حالياً</h1>
    <p>
      يبدو أن اتصال الإنترنت منقطع. صفحات النظام التي زرتها مسبقاً (تجهيز بطاقات الرقم القومي، استوديو 4x6، ماسح المستندات، وإدارة المخزن) تعمل محلياً بكامل كفاءتها بدون إنترنت.
    </p>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة والتحقق من الشبكة</button>
    <p class="note">كوبي كات (Copy Cat) — نظام طباعة وإدارة وتصوير أوفلاين</p>
  </div>
</body>
</html>
